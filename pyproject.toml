[project]
name = "self-learning-platform"
version = "0.1.0"
description = "Self Learning Platform - PDF extraction agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nishant Raj", email = "nraj02415@gmail.com" }
]
dependencies = [
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
